name: clean_architecture
description: A comprehensive guide to building scalable and maintainable Flutter applications using Architecture patterns and design Principles.
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  alice: ^1.0.0
  alice_dio: ^1.0.6
  auto_route: ^11.1.0
  collection: ^1.19.1
  cpf_cnpj_validator: ^2.0.0
  cupertino_icons: ^1.0.8
  dio: ^5.8.0+1
  drift: ^2.22.0
  encrypt: ^5.0.3
  equatable: ^2.0.8
  firebase_analytics: ^12.4.0
  firebase_auth: ^6.5.0
  firebase_core: ^4.8.0
  firebase_crashlytics: ^5.2.1
  firebase_messaging: ^16.2.1
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_dotenv: ^6.0.0
  flutter_hooks: ^0.21.2
  flutter_local_notifications: ^19.5.0
  flutter_sliding_toast: ^1.5.2
  flutter_web_plugins:
    sdk: flutter
  get_it: ^9.1.0
  google_sign_in: ^7.2.0
  http_parser: ^4.1.2
  image_picker: ^1.2.1
  injectable: ^3.0.0
  internet_connection_checker_plus: ^3.0.0
  intl: ^0.20.2
  path: ^1.9.0
  path_provider: ^2.1.5
  sqlite3_flutter_libs: ^0.5.0
  supabase_flutter: ^2.12.4
  url_launcher: ^6.3.2

dev_dependencies:
  auto_route_generator: ^10.4.0 
  bloc_test: ^10.0.0
  build_runner: ^2.10.4
  drift_dev: ^2.22.0
  faker: ^2.2.0
  flutter_test:
    sdk: flutter
  http: ^1.6.0
  injectable_generator: ^3.0.2
  integration_test:
    sdk: flutter
  leancode_lint: ^22.0.1
  mocktail: ^1.0.4
  patrol: ^4.1.0
  patrol_finders: ^3.0.0

flutter:
  uses-material-design: true
  config:
    enable-swift-package-manager: false
  assets:
    - assets/
    - .env
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf

    - family: AppIcon
      fonts:
        - asset: assets/icons/AppIcon.ttf

patrol:
  app_name: cleanArchitecture
  flavor: development
  android:
    package_name: com.servicepro.connect
  ios:
    bundle_id: com.servicepro.connect
